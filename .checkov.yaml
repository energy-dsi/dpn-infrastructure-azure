# ==============================================================================
# Checkov Configuration - DPN Reference Infrastructure
# ==============================================================================
# Three-tier approach to managing Checkov findings:
#
#   skip-check   → False positives or architecturally not applicable.
#                  These will NOT appear in reports at all.
#
#   soft-fail-on → Accepted risks with documented rationale, OR checks Checkov
#                  cannot statically resolve through this codebase's nested
#                  module variable passthrough (verified correct by reading
#                  the resolved tfvars value directly - see individual notes).
#                  These ARE reported but do NOT block the pipeline.
#
#   (default)    → All other HIGH/CRITICAL findings block the pipeline.
#
# Re-run, from the repository root, `checkov -d dpn-azure-infrastructure
# --var-file dpn-azure-infrastructure/environments/dpn_infrastructure.tfvars
# --config-file .checkov.yaml` after changing dpn_infrastructure.tfvars -
# findings depend on the actual configured values, not just each variable's
# declared default. --var-file resolves relative to the current working
# directory, not to -d, so dropping the "dpn-azure-infrastructure/" prefix
# silently fails to load the tfvars file and produces different (wrong)
# findings with no error other than a parsing_errors entry in JSON output.
# ==============================================================================

# Run against Terraform HCL and Bicep only (not ARM, CloudFormation etc.)
framework:
  - terraform
  - bicep

# ==============================================================================
# SKIP: False positives / architecturally not applicable
# ==============================================================================
skip-check:

  # ── Terraform module source checks ────────────────────────────────────────
  # CKV_TF_1 / CKV_TF_2 require a git URL + commit hash on module sources.
  # All modules in this codebase are LOCAL PATH modules within the same
  # monorepo. Git URL pinning applies to registry/remote modules only.
  - CKV_TF_1   # Module source must use git URL with commit hash — N/A: local path modules
  - CKV_TF_2   # Module must be pinned to specific version — N/A: local path modules

  # ── Networking: null_resource provisioner ─────────────────────────────────
  # The networking module uses null_resource with local-exec (Azure CLI) to
  # create subnets with NSGs attached atomically. This is a deliberate
  # workaround for Azure Policy that requires NSG attachment at subnet creation
  # time. The az CLI commands are parameterised and injection-safe.
  - CKV2_TF_1  # Avoid null_resource / external provider — required for atomic NSG/subnet creation

  # ── AKS: ephemeral OS disk ─────────────────────────────────────────────────
  # Ephemeral OS disks are suitable for stateless/burst workloads. These AKS
  # clusters run stateful platform workloads (workload identity, persistent
  # PVCs). Standard managed OS disk is the correct choice.
  - CKV_AZURE_226  # AKS node pool must use ephemeral OS disk — stateful workloads, not applicable

  # ── Cosmos DB / VM scale set checks: no matching resource in this codebase ──
  - CKV_AZURE_132  # Cosmos DB privileged escalation — N/A, no azurerm_cosmosdb_account in this codebase
  - CKV_AZURE_97   # VMSS encryption at host — N/A, no VM scale set resource declared directly

  # ── Security contact email (subscription-level) ───────────────────────────
  # Targets azurerm_security_center_contact - a subscription-wide resource,
  # not something a per-workload Terraform module should own (one tenant may
  # deploy this module many times; only one security contact should exist per
  # subscription). Confirmed via `checkov --list` against the installed
  # version this check has no relation to ACR/CMK - a previous version of
  # this file mis-described it as an ACR customer-managed-key check.
  - CKV_AZURE_131  # Security contact email not set — subscription-level resource, out of scope for this module

  # ── VNet local DNS addresses ───────────────────────────────────────────────
  # Targets azurerm_virtual_network (dns_servers). This codebase never
  # creates a managed VNet - modules/networking/data.tf reads an existing
  # landing-zone VNet via a data source only (see root README's "landing-zone
  # assumptions"). No matching managed resource exists for this check to
  # evaluate. A previous version of this file mis-described this ID as a
  # subnet/VNet address-space ForceNew constraint.
  - CKV_AZURE_183  # VNet local DNS addresses — N/A, VNet is a data source in this codebase, never a managed resource

  # ── ACR: Docker Content Trust ────────────────────────────────────────────────
  # Confirmed via `tofu validate`: the `trust_policy` block on
  # azurerm_container_registry is rejected by the current azurerm provider
  # ("Unsupported block type") - Azure deprecated Docker Content Trust for ACR
  # in favor of policy-based image signing (Notation/Ratify via Azure Policy),
  # which is not configurable through this Terraform resource at all. Not a
  # gap this module can close - enforce image signing via Azure Policy instead.
  - CKV_AZURE_164  # ACR signed/trusted images — feature removed from azurerm provider, enforce via Azure Policy instead

# ==============================================================================
# SOFT-FAIL: Accepted risks — reported but do not block pipeline
# ==============================================================================
soft-fail-on:

  # ── Checkov resolution limitation (verified correct via tfvars) ────────────
  # These values pass through 2+ module boundaries (root var -> module var ->
  # resource attribute, sometimes via a ternary gated on another variable).
  # Checkov's static graph resolution does not reliably follow that chain even
  # with --var-file. Each has been manually confirmed correct by reading the
  # resolved terraform.tfvars value against the module code. Kept soft-failed
  # rather than skipped so a genuine future regression (e.g. a new
  # environment's tfvars omitting the value) still shows up in reports.
  - CKV_AZURE_44   # Storage account TLS version — confirmed TLS1_2 in terraform.tfvars for all 3 storage accounts
  - CKV_AZURE_227  # AKS host/temp-disk encryption — confirmed true in terraform.tfvars (both node pools)
  - CKV_AZURE_233  # ACR zone redundancy — confirmed true in terraform.tfvars (acr_sku=Premium, zone_redundancy_enabled=true)
  - CKV_AZURE_237  # ACR dedicated data endpoints — module enables this unconditionally when sku=Premium (confirmed Premium in tfvars)
  - CKV_AZURE_168  # AKS max_pods=50 — set via var.aks_max_pods default; Checkov doesn't resolve multi-level module variable defaults
  - CKV2_AZURE_30  # ACR webhook HTTPS — enforced by a variable validation block requiring https:// on every service_uri; Checkov can't see for_each-map constraints

  # NOTE: CKV2_AZURE_18 (previously listed here with intent "storage
  # infrastructure double encryption") was removed - confirmed via
  # `checkov --list` against the installed 3.3.8 version that this ID does
  # not exist in current Checkov, so soft-failing it was a no-op. The
  # underlying security intent is now met directly: modules/storage defaults
  # infrastructure_encryption_enabled to true (see Trivy AVD-AZU-0061 in
  # .trivyignore for the equivalent, real check that covers this).
  # CKV_AZURE_131 (previously misfiled here as an ACR-CMK check) has been
  # moved to skip-check above with its correct meaning.

  # ── ACR: vulnerability scanning ─────────────────────────────────────────────
  # Requires Microsoft Defender for Containers registered at the subscription
  # level (azurerm_security_center_pricing) - a subscription-wide, billable
  # setting outside this ACR module's scope, and one many tenants manage
  # centrally rather than per-workload. Enable it at the subscription level if
  # your tenant doesn't already.
  - CKV_AZURE_163   # ACR vulnerability scanning — requires subscription-level Defender for Containers enrollment

  # ── ACR: geo-replication ────────────────────────────────────────────────────
  # georeplications is wired and functional (var.acr_georeplications), but
  # empty by default: replicating to another region requires choosing a
  # target region and roughly doubles registry storage cost, so this stays an
  # explicit customer opt-in rather than a forced default.
  - CKV_AZURE_165   # ACR geo-replication — customer must choose a target region; not set by default

  # ── ACR: quarantine policy ───────────────────────────────────────────────────
  # var.acr_quarantine_policy_enabled defaults to false. When enabled, every
  # pushed image is held in a locked, unpullable state until an external
  # scanning integration explicitly marks it as passed. This codebase does
  # not provide that integration, and a previous version of this module
  # enabled quarantine unconditionally on Premium SKU without one - which
  # left every pushed image permanently stuck and undeployable. Only enable
  # this if you have a scanning pipeline that clears quarantined images.
  - CKV_AZURE_166   # ACR quarantine policy — requires an external scanning integration not provided by this codebase; off by default

  # ── Event Grid: public network access ───────────────────────────────────────
  # A platform limitation, not a config choice: Microsoft Defender for Storage
  # cannot deliver malware-scan-result events to an Event Grid topic that is
  # restricted to a private endpoint only. If this topic is wired to receive
  # Defender for Storage events (the file-scanning pipeline this module was
  # built for - see modules/event_grid/README.md), public_network_access_enabled
  # must stay true even though a private endpoint is also deployed. If your
  # topic does not receive Defender for Storage events, set it to false.
  - CKV_AZURE_193   # Event Grid public network access enabled — required for Defender for Storage event delivery

  # ── AKS monitoring ─────────────────────────────────────────────────────────
  # RESOLVED - aks_secret_rotation_enabled defaults to true in
  # dpn_infrastructure.tfvars, wired to key_vault_secrets_provider/
  # secret_rotation_enabled. Does not currently appear as a Checkov failure;
  # kept soft-failed as a safety net against a future tfvars regression.
  - CKV_AZURE_172   # AKS Secrets Store CSI Driver autorotation — already enabled via aks_secret_rotation_enabled, kept as safety net

  # ── AKS Defender ───────────────────────────────────────────────────────────
  - CKV_AZURE_85    # AKS Defender profile not enabled — accepted for dev/test

  # ── Key Vault: network access ───────────────────────────────────────────────
  # RESOLVED - keyvault_public_network_access_enabled defaults to false in
  # dpn_infrastructure.tfvars. Does not currently appear as a Checkov
  # failure; kept soft-failed as a safety net against a future tfvars
  # regression (e.g. an environment that sets this true for initial setup
  # access and forgets to lock it back down).
  - CKV_AZURE_189   # Key Vault public network access — already disabled by default, kept as safety net

  # ── Key Vault: firewall rules ────────────────────────────────────────────────
  # RESOLVED - keyvault_network_acls_enabled defaults to true with
  # network_acls_default_action = "Deny" in dpn_infrastructure.tfvars. Does
  # not currently appear as a Checkov failure; kept soft-failed as a safety
  # net against a future tfvars regression.
  - CKV_AZURE_109   # Key Vault firewall rules — already configured (default_action=Deny) by default, kept as safety net

  # ── AKS: network policy ──────────────────────────────────────────────────────
  - CKV_AZURE_7     # AKS network policy — configured via network_policy variable

  # ── AKS: local admin account disabled ────────────────────────────────────────
  # All environments already set local_account_disabled = true — this check
  # should already PASS; kept as a documented safety net.
  - CKV_AZURE_141   # AKS local admin account — already disabled in all envs, kept as safety net

  # ── Service Bus: managed identity ───────────────────────────────────────────
  # RESOLVED - service_bus_encryption_enabled defaults to true in
  # dpn_infrastructure.tfvars, which wires a UserAssigned identity block onto
  # the namespace (required for CMK). Does not currently appear as a Checkov
  # failure; kept soft-failed as a safety net against a future tfvars
  # regression (e.g. CMK turned off without re-checking this).
  - CKV_AZURE_202   # Service Bus managed identity — already configured via the CMK identity, kept as safety net

  # ── Key Vault: HSM-backed keys ──────────────────────────────────────────────
  # HSM-backed keys (RSA-HSM/EC-HSM) require Key Vault Premium SKU - a real
  # cost tradeoff (this codebase defaults to standard SKU). Set
  # keyvault_sku_name = "premium" and key_type = "RSA-HSM"/"EC-HSM" in
  # keyvault_initial_keys to opt in.
  - CKV_AZURE_112   # Key Vault key not HSM-backed — Premium SKU cost tradeoff, customer opt-in

  # ==============================================================================
  # SOFT-FAIL: ForceNew risk — remediation would destroy/recreate live resources
  # These checks flag security attributes whose correction on an existing resource
  # requires Terraform to destroy and recreate it (ForceNew). All environments
  # already have the correct values set in tfvars. The checks are soft-failed to:
  #   a) Ensure they appear in assurance reports
  #   b) Prevent pipeline breakage if Checkov version changes detection behaviour
  #   c) Guard against accidentally under-provisioned new environments
  # DO NOT attempt in-place code remediation — add to lifecycle or fix in tfvars
  # before initial deployment of any new environment.
  # ==============================================================================

  # ── AKS: private cluster (ForceNew) ──────────────────────────────────────────
  - CKV_AZURE_115   # AKS must be a private cluster — ForceNew, already true in all envs

  # NOTE: CKV2_AZURE_93 ("VM vTPM enabled") and CKV2_AZURE_128 ("Key Vault
  # soft-delete retention") were removed from this section - confirmed via
  # `checkov --list` against the installed 3.3.8 version that neither ID
  # exists in current Checkov, so soft-failing them was a no-op. The
  # underlying security intent for both is independently confirmed met:
  # vm_vtpm_enabled / vm_secure_boot_enabled default to true in
  # dpn_infrastructure.tfvars (modules/vm), and
  # keyvault_soft_delete_retention_days defaults to 90 with
  # keyvault_purge_protection_enabled = true. CKV_AZURE_183 ("VNet/subnet
  # address-space ForceNew") was also removed from here - it was a
  # misidentification of what that check ID actually verifies; see the
  # correctly-described CKV_AZURE_183 entry under skip-check above.
